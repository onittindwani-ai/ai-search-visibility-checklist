name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests (no network, the site checker uses fixture files)
        run: python -m unittest discover tests -v
      - name: Engine tests (app and command line tool must agree)
        run: node --test tests/engine.test.mjs
        env:
          PYTHON: python
      - name: Generated files are in step with data
        run: python tools/visibility.py build --check
      - name: Kit check
        run: python tests/check_kit.py
      - name: Sample report
        run: python tools/visibility.py report --file data/sample-business.json
